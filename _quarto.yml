project:
  type: default
  output-dir: docs
  render:
    - w04-fund-contract.qmd
    - w05-venture-contract.qmd
    - w04-preparation.qmd
    - w05-preparation.qmd
    - exercises.qmd
    - student-notes.qmd

lang: zh-CN

format:
  html:
    theme: cosmo
    css: pevc-handout.css
    toc: true
    toc-title: "本讲目录"
    toc-location: left
    toc-depth: 2
    number-sections: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    embed-resources: true
    self-contained-math: true
    html-math-method: katex
